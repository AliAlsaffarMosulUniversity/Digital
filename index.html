<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر الأعمال الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Readex+Pro:wght@300;400;500;600&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lab notebook. One company is built lab by lab along a path of 12 nodes; each lab is a numbered checklist sheet. */
:root{
  --bg:#EAF6FB; --card:#FFFFFF; --ink:#1F2A44; --muted:#5A6A86; --line:#CFE3EE;
  --accent:#1B78B8; --accent-ink:#FFFFFF; --mark:#FFD84D; --ok:#22A06B; --warn:#E5693A; --code:#EEF5FA;
  --c1:#1B9AD6; --c2:#22B58A; --c3:#FF8A5B; --c4:#9A6BFF; --c5:#FF6F91; --c6:#F2B705;
  --display:'Baloo Bhaijaan 2','Readex Pro',system-ui,sans-serif;
  --body:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A2E; --card:#182540; --ink:#EAF1FF; --muted:#A3B4D4; --line:#2B3C5E;
    --accent:#5CC0F2; --accent-ink:#06223A; --mark:#FFD84D; --ok:#5FD6A0; --warn:#FF9A70; --code:#0E1730;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A2E; --card:#182540; --ink:#EAF1FF; --muted:#A3B4D4; --line:#2B3C5E;
  --accent:#5CC0F2; --accent-ink:#06223A; --mark:#FFD84D; --ok:#5FD6A0; --warn:#FF9A70; --code:#0E1730;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;font-weight:400}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand b{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 10px;font-size:14px}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
/* hero */
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(30px,6vw,50px);font-weight:700}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 6px;border-radius:6px}
.hero p{max-width:60ch;color:var(--muted);margin:12px 0 0}
.path{display:flex;align-items:center;margin:26px 0 8px;overflow-x:auto;padding:6px 2px 14px}
.node{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);position:relative}
.node.part{border-color:var(--accent)}
.node.full{background:var(--ok);border-color:var(--ok);color:#fff}
.link{flex:1 0 12px;height:2px;background:var(--line);min-width:12px}
.overall{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:22px 0 40px}
.lab-card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c,var(--accent));border-radius:16px;padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px}
.lab-card:hover{border-color:var(--accent)}
.lab-card .n{font-family:var(--display);font-size:40px;font-weight:800;color:var(--c,var(--accent));line-height:1}
.lab-card h3{font-size:19px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:999px;padding:0 10px;direction:ltr;unicode-bidi:isolate}
/* lab page */
.lab-head{padding:26px 0 8px}
.crumbs{font-size:14px;color:var(--muted)}
.lab-head h1{font-size:clamp(26px,5vw,40px);margin:6px 0 10px}
.lab-head .num{font-family:var(--display);color:var(--accent)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 0 var(--line);padding:16px 18px;margin:16px 0}
.box.theory{border-inline-start:5px solid var(--mark)}
.box h2{font-size:21px;margin-bottom:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{appearance:none;flex:none;width:24px;height:24px;margin:3px 0 0;border:2px solid var(--muted);border-radius:6px;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.chk .body{flex:1;min-width:0}
.chk.done .txt{color:var(--muted)}
.chk .sn{font-family:var(--display);font-weight:700;color:var(--accent);margin-inline-end:6px}
.ui{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.chip{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:15px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:0 10px;line-height:1.7}
.sep{color:var(--muted);font-size:14px}
.code{margin-top:8px;direction:ltr;text-align:left;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:14.5px;white-space:pre-wrap;word-break:break-word;position:relative}
.copy{position:absolute;top:6px;right:6px;font-family:var(--body);font-size:13px;padding:1px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.code.has{padding-right:70px}
.err li{margin-bottom:6px}
.ltr-name{direction:ltr;text-align:right;unicode-bidi:plaintext}
.err{padding-inline-start:20px;margin:0}
details.box summary{cursor:pointer;font-family:var(--display);font-size:21px;font-weight:700}
.prog{display:flex;align-items:center;gap:12px;margin:10px 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin:26px 0 50px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:18px 0 32px;color:var(--muted);font-size:14px}
/* focus mode */
.focus{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow:auto}
.focus .bar-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.focus .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.focus .slide{max-width:860px;width:100%}
.focus .k{font-family:var(--display);color:var(--accent);font-size:20px}
.focus .big{font-size:clamp(26px,4.6vw,44px);line-height:1.55;font-weight:500;margin:6px 0 14px}
.focus .chip{font-size:clamp(18px,3vw,28px);padding:2px 16px}
.focus .code{font-size:clamp(15px,2.4vw,22px)}
.focus .nav{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);justify-content:space-between;flex-wrap:wrap}
@media (max-width:480px){body{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#" id="brand">مختبر الأعمال <b>الرقمية</b></a>
  <a class="btn small" href="#tools">البرامج</a>
  <button class="btn small" id="resetBtn" type="button">مسح تقدّمي</button>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">إعداد م.م. علي عبد الوهاب الصفار، كلية الإدارة والاقتصاد، جامعة الموصل. واجهات الأدوات تتغير، فإن اختلف اسم زر فابحث عن أقرب اسم له.</div></footer>
<div id="focusRoot"></div>

/* ---------- state ---------- */
var KEY='dbm-labs-v1', state={done:{}};
function load(){try{var r=localStorage.getItem(KEY);if(r)state=JSON.parse(r)||{done:{}};if(!state.done)state.done={}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
load();
function k(l,kind,i){return l.id+':'+kind+':'+i}
function labItems(l){var a=[],i;for(i=0;i<l.prep.length;i++)a.push(k(l,'p',i));for(i=0;i<l.steps.length;i++)a.push(k(l,'s',i));for(i=0;i<l.ok.length;i++)a.push(k(l,'k',i));return a}
function labPct(l){var it=labItems(l),d=0;it.forEach(function(x){if(state.done[x])d++});return {d:d,n:it.length,p:Math.round(100*d/it.length)}}
function allPct(){var d=0,n=0;LABS.forEach(function(l){var r=labPct(l);d+=r.d;n+=r.n});return Math.round(100*d/n)}

/* ---------- helpers ---------- */
function h(tag,attrs){var e=document.createElement(tag),i,c;attrs=attrs||{};for(var a in attrs){if(a==='class')e.className=attrs[a];else if(a==='text')e.textContent=attrs[a];else if(a.slice(0,2)==='on')e.addEventListener(a.slice(2),attrs[a]);else e.setAttribute(a,attrs[a])}
 for(i=2;i<arguments.length;i++){c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c)}return e}
function uiRow(list){var row=h('div',{class:'ui'});list.forEach(function(t,i){if(i)row.appendChild(h('span',{class:'sep',text:'‹'}));row.appendChild(h('span',{class:'chip',text:t}))});return row}
function copyBtn(text,pre){
  var b=h('button',{class:'copy',type:'button',text:'نسخ'});
  b.addEventListener('click',function(){
    var ok=false;
    try{navigator.clipboard.writeText(text).then(function(){b.textContent='تم النسخ';setTimeout(function(){b.textContent='نسخ'},1400)},function(){sel()});ok=true}catch(e){}
    if(!ok)sel();
    function sel(){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent='حدّد ثم Ctrl+C';setTimeout(function(){b.textContent='نسخ'},2200)}
  });return b}
function codeBox(text){var pre=h('div',{class:'code has'});var span=h('span',{text:text});pre.appendChild(span);pre.appendChild(copyBtn(text,span));return pre}

/* ---------- views ---------- */
var app=document.getElementById('app');
function home(){
  app.innerHTML='';
  var pct=allPct();
  var path=h('div',{class:'path'});
  LABS.forEach(function(l,i){var r=labPct(l);if(i)path.appendChild(h('span',{class:'link'}));
    path.appendChild(h('a',{class:'node '+(r.p===100?'full':r.p>0?'part':''),href:'#lab-'+l.id,'aria-label':'المختبر '+l.id,text:String(l.id)}))});
  var bar=h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'}));
  app.appendChild(h('section',{class:'hero'},
    h('h1',{},'اثنا عشر مختبرًا، ',h('em',{text:'شركة رقمية واحدة'})),
    h('p',{text:'مادة إدارة الأعمال الرقمية، الجانب العملي. تبني في كل مختبر قطعة جديدة من الشركة: نموذج عمل، موقع، متجر، قاعدة عملاء، لوحة مؤشرات، أتمتة. اتبع الخطوات بالترتيب وعلّم ما أنجزته.'}),
    path,
    h('div',{class:'actions',style:'margin:0 0 10px'},h('a',{class:'btn primary',href:'#tools',text:'كل البرامج التي سنتعلمها (15)'})),
    h('div',{class:'overall'},h('span',{text:'تقدّمك الكلي'}),bar,h('strong',{text:pct+'%'}))));
  var g=h('div',{class:'grid'});
  LABS.forEach(function(l){var r=labPct(l);
    g.appendChild(h('a',{class:'lab-card',style:'--c:var(--c'+((l.id-1)%6+1)+')',href:'#lab-'+l.id},
      h('div',{class:'n',text:String(l.id)}),
      h('h3',{text:l.title}),
      h('div',{class:'meta'},h('span',{class:'tag',text:l.tool}),h('span',{text:l.min+' دقيقة'}),h('span',{text:r.d+' من '+r.n})),
      h('div',{class:'bar'},h('i',{style:'width:'+r.p+'%'}))))});
  app.appendChild(g);
  document.title='مختبر الأعمال الرقمية';
}

function checkRow(l,kind,i,node,extra){
  var key=k(l,kind,i);
  var cb=h('input',{type:'checkbox',id:'c-'+key.replace(/:/g,'-')});
  cb.checked=!!state.done[key];
  var row=h('div',{class:'chk'+(cb.checked?' done':'')});
  cb.addEventListener('change',function(){if(cb.checked)state.done[key]=1;else delete state.done[key];save();row.classList.toggle('done',cb.checked);refreshProg(l)});
  row.appendChild(cb);row.appendChild(node);return row}

function refreshProg(l){var r=labPct(l);var p=document.getElementById('labProg');if(p){p.querySelector('i').style.width=r.p+'%';p.querySelector('strong').textContent=r.d+' من '+r.n}}

function lab(id){
  var l=LABS.filter(function(x){return x.id===id})[0];
  if(!l){location.hash='';return}
  app.innerHTML='';
  var r=labPct(l);
  app.appendChild(h('div',{class:'lab-head'},
    h('div',{class:'crumbs'},h('a',{href:'#',text:'كل المختبرات'}),' › المختبر '+l.id),
    h('h1',{},h('span',{class:'num',text:l.id+'. '}),l.title),
    h('div',{class:'meta'},h('span',{class:'tag',text:l.tool}),h('span',{text:l.min+' دقيقة'}))));
  var acts=h('div',{class:'actions'});
  acts.appendChild(h('button',{class:'btn primary',type:'button',text:'وضع العرض: خطوة خطوة',onclick:function(){focusMode(l)}}));
  if(l.url)acts.appendChild(h('a',{class:'btn',href:l.url,target:'_blank',rel:'noopener',text:'فتح موقع الأداة'}));
  app.appendChild(acts);
  app.appendChild(h('div',{class:'prog',id:'labProg'},h('span',{text:'تقدّمك'}),h('div',{class:'bar'},h('i',{style:'width:'+r.p+'%'})),h('strong',{text:r.d+' من '+r.n})));
  app.appendChild(h('div',{class:'box theory'},h('h2',{text:'الربط بالنظري'}),h('div',{text:l.link}),h('div',{style:'margin-top:8px;color:var(--muted)',text:'الهدف: '+l.goal})));

  var prep=h('section',{class:'box'},h('h2',{text:'قبل أن تبدأ'}));
  l.prep.forEach(function(t,i){prep.appendChild(checkRow(l,'p',i,h('div',{class:'body'},h('div',{class:'txt',text:t}))))});
  app.appendChild(prep);

  var st=h('section',{class:'box'},h('h2',{text:'الخطوات'}));
  l.steps.forEach(function(s,i){
    var body=h('div',{class:'body'},h('div',{class:'txt'},h('span',{class:'sn',text:(i+1)+'.'}),s.t));
    if(s.ui.length)body.appendChild(uiRow(s.ui));
    if(s.code)body.appendChild(codeBox(s.code));
    st.appendChild(checkRow(l,'s',i,body))});
  app.appendChild(st);

  app.appendChild(h('section',{class:'box'},h('h2',{text:'ما تسلّمه'}),h('div',{text:l.out})));

  var ok=h('section',{class:'box'},h('h2',{text:l.id===12?'معايير التقييم (40 درجة)':'تأكد من نجاحك'}));
  l.ok.forEach(function(t,i){ok.appendChild(checkRow(l,'k',i,h('div',{class:'body'},h('div',{class:'txt',text:t}))))});
  app.appendChild(ok);

  var er=h('details',{class:'box'},h('summary',{text:l.id===12?'أسئلة ونصائح':'أخطاء شائعة'}));
  var ul=h('ul',{class:'err'});l.err.forEach(function(t){ul.appendChild(h('li',{text:t}))});er.appendChild(ul);
  app.appendChild(er);

  var pager=h('div',{class:'pager'});
  if(l.id>1)pager.appendChild(h('a',{class:'btn',href:'#lab-'+(l.id-1),text:'‹ المختبر السابق'}));else pager.appendChild(h('span'));
  if(l.id<LABS.length)pager.appendChild(h('a',{class:'btn primary',href:'#lab-'+(l.id+1),text:'المختبر التالي ›'}));
  app.appendChild(pager);
  document.title='المختبر '+l.id+' · '+l.title;
  window.scrollTo(0,0);
}

/* ---------- focus mode ---------- */
var fr=document.getElementById('focusRoot'), fState=null;
function focusMode(l){
  var idx=0;
  for(var i=0;i<l.steps.length;i++){if(!state.done[k(l,'s',i)]){idx=i;break}}
  fState={l:l,i:idx};drawFocus();
}
function closeFocus(){fState=null;fr.innerHTML='';document.removeEventListener('keydown',fkey);lab(parseInt((location.hash.match(/lab-(\d+)/)||[])[1],10))}
function fkey(e){if(!fState)return;if(e.key==='Escape')closeFocus();else if(e.key==='ArrowLeft')fgo(1);else if(e.key==='ArrowRight')fgo(-1)}
function fgo(d){var n=fState.l.steps.length,j=fState.i+d;if(j<0||j>=n)return;fState.i=j;drawFocus()}
function drawFocus(){
  var l=fState.l,i=fState.i,s=l.steps[i],key=k(l,'s',i),n=l.steps.length;
  fr.innerHTML='';
  var slide=h('div',{class:'slide'},h('div',{class:'k',text:'المختبر '+l.id+' · الخطوة '+(i+1)+' من '+n}),h('div',{class:'big',text:s.t}));
  if(s.ui.length)slide.appendChild(uiRow(s.ui));
  if(s.code)slide.appendChild(codeBox(s.code));
  var doneBtn=h('button',{class:'btn primary',type:'button',text:state.done[key]?'ألغِ التعليم':'تمّت هذه الخطوة',onclick:function(){if(state.done[key])delete state.done[key];else{state.done[key]=1}save();if(state.done[key]&&i<n-1){fState.i=i+1}drawFocus()}});
  var f=h('div',{class:'focus',role:'dialog','aria-label':'وضع العرض'},
    h('div',{class:'bar-top'},h('strong',{text:l.title}),h('div',{class:'bar',style:'flex:1'},h('i',{style:'width:'+Math.round(100*(i+1)/n)+'%'})),h('button',{class:'btn small',type:'button',text:'إغلاق',onclick:closeFocus})),
    h('div',{class:'stage'},slide),
    h('div',{class:'nav'},
      h('button',{class:'btn',type:'button',text:'‹ السابق',onclick:function(){fgo(-1)}}),
      doneBtn,
      h('button',{class:'btn',type:'button',text:'التالي ›',onclick:function(){fgo(1)}})));
  fr.appendChild(f);
  document.removeEventListener('keydown',fkey);document.addEventListener('keydown',fkey);
}

/* ---------- routing ---------- */
function route(){
  if(fState){fState=null;fr.innerHTML=''}
  if(location.hash==='#tools'){tools();return}
  var m=location.hash.match(/^#lab-(\d+)$/);
  if(m)lab(parseInt(m[1],10));else{home();window.scrollTo(0,0)}
}
window.addEventListener('hashchange',route);

});

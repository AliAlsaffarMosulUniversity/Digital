<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B78B8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('dbm-theme')==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<title>مختبر الأعمال الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Readex+Pro:wght@300;400;500;600&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a playful study app. Chunky 3D cards, one colour per lab, a robot guide, and a bottom tab bar like a phone app. */
:root{
  --bg:#EAF6FB; --card:#FFFFFF; --ink:#1F2A44; --muted:#5A6A86; --line:#CFE3EE;
  --accent:#1B78B8; --accent-ink:#FFFFFF; --mark:#FFD84D; --ok:#22A06B; --bad:#E5484D; --code:#EEF5FA;
  --c1:#1B9AD6; --c2:#22B58A; --c3:#FF8A5B; --c4:#9A6BFF; --c5:#FF6F91; --c6:#F2B705;
  --h1:#1B78B8; --h2:#6B4DE0;
  --display:'Baloo Bhaijaan 2','Readex Pro',system-ui,sans-serif;
  --body:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101A2E; --card:#182540; --ink:#EAF1FF; --muted:#A3B4D4; --line:#2B3C5E;
  --accent:#5CC0F2; --accent-ink:#06223A; --mark:#FFD84D; --ok:#5FD6A0; --bad:#FF7A80; --code:#0E1730;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--line) 1.3px,transparent 1.3px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:calc(17px*var(--fs,1));line-height:1.85}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
main{padding-bottom:96px}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
.shade{--d:color-mix(in srgb,var(--c,var(--accent)) 62%,#000)}

/* header */
header.top{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:6}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand{flex:0 1 auto}
.brand .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c5))}

/* buttons */
.btn{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:6px 16px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;line-height:1.6}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 70%,#000)}
.btn.small{padding:2px 12px;font-size:14.5px;border-radius:12px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}

/* tab bar */
.tabbar{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px;z-index:8}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px;text-decoration:none;color:var(--muted);padding:4px 2px;border-radius:16px;font-weight:500;line-height:1.5}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}

/* shapes */
.badge{--c:var(--accent);width:56px;height:56px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;border-bottom:5px solid color-mix(in srgb,var(--c) 62%,#000)}
.badge.big{width:76px;height:76px;border-radius:24px}
.badge svg{width:60%;height:60%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stars{display:inline-flex;gap:2px;direction:ltr}
.stars svg{width:22px;height:22px;stroke:#D9A400;stroke-width:1.5;stroke-linejoin:round;fill:none;opacity:.55}
.stars svg.on{fill:var(--mark);opacity:1}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden;flex:1;min-width:100px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));width:0;border-radius:8px;transition:width .35s}
@media (prefers-reduced-motion:reduce){.bar i,.fc-in{transition:none!important}.mascot{animation:none!important}}
.tag{border:2px solid var(--line);border-radius:999px;padding:0 12px;direction:ltr;unicode-bidi:isolate;font-size:14px;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);align-items:center}

/* hero */
.hero-card{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:30px;border-bottom:7px solid rgba(0,0,0,.22);padding:22px;margin-top:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero-card::before,.hero-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-card::before{width:170px;height:170px;top:-60px;inset-inline-start:-40px}
.hero-card::after{width:110px;height:110px;bottom:-40px;inset-inline-end:30%}
.hero-card>*{position:relative;z-index:1}
.mascot{width:118px;flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.hero-text{flex:1;min-width:230px}
.hero-text h1{font-size:clamp(28px,6vw,44px);font-weight:800;margin-bottom:8px}
.bubble{background:#fff;color:#1F2A44;border-radius:18px;padding:8px 14px;display:inline-block;font-weight:500;position:relative}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:rgba(255,255,255,.2);border-radius:16px;padding:4px 14px;display:flex;align-items:center;gap:8px;font-weight:500}
.stat svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat svg.fill{fill:var(--mark);stroke:#D9A400}
.path{display:flex;align-items:center;margin:20px 0 6px;overflow-x:auto;padding:6px 2px 12px}
.node{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;text-decoration:none;color:var(--ink)}
.node.part{border-color:var(--accent)}
.node.full{background:var(--ok);border-color:var(--ok);color:#fff}
.link{flex:1 0 12px;height:4px;border-radius:3px;background:var(--line);min-width:12px}
.sec-title{font-size:26px;margin:22px 0 4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:14px 0 24px}
.lab-card{--c:var(--accent);background:var(--card);border:2px solid var(--line);border-bottom:7px solid color-mix(in srgb,var(--c) 62%,#000);border-radius:24px;padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.lab-card::before{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:var(--c);opacity:.14}
.lab-card:hover{border-color:var(--c)}
.lab-card:active{transform:translateY(2px)}
.lab-top{display:flex;align-items:center;gap:12px}
.lab-card .n{font-family:var(--display);font-size:38px;font-weight:800;color:var(--c);line-height:1;margin-inline-start:auto}
.lab-card h3{font-size:20px}
.tool-card{cursor:default}

/* lab page */
.lab-banner{--c:var(--accent);margin-top:8px;background:var(--c);color:#fff;border-radius:28px;border-bottom:7px solid color-mix(in srgb,var(--c) 62%,#000);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lab-banner .badge{background:rgba(255,255,255,.25);border-bottom-color:rgba(0,0,0,.18)}
.lab-banner h1{font-size:clamp(25px,5vw,38px);font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.lab-banner .tag{color:#fff;border-color:rgba(255,255,255,.6)}
.lab-banner .meta{color:#fff}
.lab-banner .stars{margin-inline-start:auto}
.box{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:16px 18px;margin:16px 0}
.box.theory{border-color:var(--mark)}
.box h2{font-size:23px;margin-bottom:8px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--line)}
.chk:first-of-type{border-top:0}
.chk input{appearance:none;flex:none;width:28px;height:28px;margin:3px 0 0;border:3px solid var(--muted);border-radius:9px;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.chk .body{flex:1;min-width:0}
.chk.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;margin-inline-end:8px;font-size:16px;line-height:1}
.ui{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.chip{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:15px;background:var(--code);border:2px solid var(--line);border-radius:10px;padding:0 10px;line-height:1.7}
.sep{color:var(--muted);font-size:14px}
.code{margin-top:8px;direction:ltr;text-align:left;background:var(--code);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--mono);font-size:14.5px;white-space:pre-wrap;word-break:break-word;position:relative}
.copy{position:absolute;top:6px;right:6px;font-family:var(--body);font-size:13px;padding:1px 10px;border:2px solid var(--line);border-radius:8px;background:var(--card)}
.code.has{padding-right:78px}
.err{padding-inline-start:20px;margin:0}
.err li{margin-bottom:6px}
details.box summary{cursor:pointer;font-family:var(--display);font-size:23px;font-weight:700}
.prog{display:flex;align-items:center;gap:12px;margin:14px 0}
.celebrate{background:linear-gradient(135deg,var(--c2),var(--c6));color:#1F2A44;border-radius:20px;padding:10px 16px;font-weight:600;margin:12px 0;display:none}
.celebrate.show{display:block}
.pager{display:flex;justify-content:space-between;gap:10px;margin:22px 0;flex-wrap:wrap}

/* flashcards */
.fc{perspective:1100px;height:270px;margin:16px 0;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;border-bottom:7px solid rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px}
.face.front{background:linear-gradient(135deg,var(--c),var(--c4));color:#fff}
.face.back{background:var(--card);border:3px solid var(--c);border-bottom-width:7px;transform:rotateY(180deg)}
.face .term{font-family:var(--mono);font-size:clamp(26px,6vw,40px);font-weight:500;direction:ltr}
.face .hint{opacity:.85;font-size:15px}
.face .mean{font-size:clamp(19px,3.6vw,25px);font-weight:500;max-width:30ch}
.fc-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* quiz */
.pick{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.pick button{min-width:64px;font-family:var(--display);font-size:22px;font-weight:700;border:3px solid var(--line);border-bottom-width:6px;background:var(--card);border-radius:18px;padding:2px 18px}
.pick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent)}
.q-text{font-size:clamp(20px,4vw,26px);font-weight:500;margin:12px 0;unicode-bidi:plaintext}
.opt{display:block;width:100%;text-align:start;unicode-bidi:plaintext;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;border-radius:18px;padding:8px 16px;margin:10px 0;font-size:18px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.expl{border-radius:18px;padding:10px 16px;margin:10px 0;background:color-mix(in srgb,var(--mark) 30%,var(--card));border:2px solid var(--mark)}
.score{font-family:var(--display);font-size:64px;font-weight:800;color:var(--accent);line-height:1.1}
.review{padding-inline-start:20px}
.review li{margin-bottom:8px}

/* modal + focus mode */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:30;display:grid;place-items:center;padding:18px}
.modal .box{max-width:520px;width:100%;margin:0}
.modal ul{padding-inline-start:20px;margin:8px 0 14px}
.focus{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;overflow:auto}
.focus .bar-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--line);background:var(--card)}
.focus .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.focus .slide{max-width:860px;width:100%}
.focus .k{font-family:var(--display);color:var(--accent);font-size:21px}
.focus .big{font-size:clamp(26px,4.6vw,44px);line-height:1.55;font-weight:500;margin:6px 0 14px}
.focus .chip{font-size:clamp(18px,3vw,28px);padding:2px 16px}
.focus .code{font-size:clamp(15px,2.4vw,22px)}
.focus .nav{display:flex;gap:10px;padding:14px 18px;border-top:2px solid var(--line);justify-content:space-between;flex-wrap:wrap;background:var(--card)}
.ltr-name{direction:ltr;text-align:right;unicode-bidi:plaintext}
.fb{background:linear-gradient(135deg,color-mix(in srgb,var(--c6) 30%,var(--card)),color-mix(in srgb,var(--c5) 22%,var(--card)));border:2px solid var(--line);border-bottom-width:6px;border-radius:26px;padding:16px 18px;margin:18px 0}
.fb h2{font-size:23px;margin-bottom:6px}
.fb .q{margin:12px 0 4px;font-weight:500}
.fb-stars{display:inline-flex;gap:4px;direction:ltr}
.fb-stars button{background:none;border:0;padding:2px;line-height:0}
.fb-stars svg{width:42px;height:42px;stroke:#D9A400;stroke-width:1.5;stroke-linejoin:round;fill:none}
.fb-stars button.on svg{fill:var(--mark)}
.fb-stars button:active{transform:scale(.92)}
.yn{display:flex;gap:10px;flex-wrap:wrap}
.yn .btn.on{background:var(--ok);color:#fff;border-color:color-mix(in srgb,var(--ok) 65%,#000)}
.fb .thanks{margin-top:6px;font-weight:600;color:var(--ok);min-height:1.6em}
.res{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res .row{display:flex;align-items:center;gap:10px}
.res .row span:first-child{width:56px;direction:ltr;text-align:right}
.about-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
@media (max-width:480px){body{font-size:calc(16px*var(--fs,1))}.mascot{width:92px}}
/* icon buttons + navigation */
.ib{width:44px;height:44px;border-radius:15px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);display:inline-grid;place-items:center;text-decoration:none;flex:none;padding:0}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib:active{transform:translateY(2px);border-bottom-width:2px}
.ib.big{width:54px;height:54px;border-radius:18px}
.ib.big svg{width:28px;height:28px}
.ib.home{background:var(--accent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 70%,#000)}
.ib.home:hover{color:var(--accent-ink)}
.crumbs{display:flex;align-items:center;gap:10px;padding-top:14px}
.hgroup{display:flex;gap:8px;margin-inline-start:auto}
.tab span{display:none}
.tab.on span{display:block}
.tab svg{width:28px;height:28px}
@media (min-width:900px){
  .tabbar{inset-block:62px 0;inset-inline:auto;inset-inline-start:0;width:92px;flex-direction:column;justify-content:flex-start;gap:8px;border-top:0;border-inline-end:2px solid var(--line);padding:14px 8px}
  .tab{max-width:none;flex:none;padding:8px 2px}
  .tab span{display:block}
  main.wrap{padding-inline-start:112px}
  main{padding-bottom:40px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="tabbar" aria-label="التنقل"></nav>
<div id="focusRoot"></div>

<script>
/* ---------- data ---------- */
var S=function(t,ui,code){return{t:t,ui:ui||[],code:code||''}};
var LABS=[
{id:1,title:'نموذج العمل الرقمي',tool:'Canva',url:'https://www.canva.com',min:90,
 link:'نموذج العمل هو مخطط هندسة النظام للشركة. كما ترسم معمارية برنامج قبل كتابته، ترسم نموذج العمل قبل إطلاق الشركة.',
 goal:'تصميم نموذج عمل من 9 مربعات لشركة رقمية جديدة.',
 prep:['الطلاب في فرق من 2 إلى 3.','كل فريق يختار فكرة شركة رقمية: توصيل طعام، متجر ملابس، دروس خصوصية أونلاين، صيانة حواسيب.'],
 steps:[
  S('افتح الموقع وسجّل الدخول بحساب Google.',['canva.com']),
  S('اضغط زر الإنشاء.',['Create']),
  S('اختر اللوح.',['Whiteboard']),
  S('اكتب في خانة البحث:',['Business Model Canvas']),
  S('اختر قالبًا مجانيًا ثم اضغط:',['Customize this template']),
  S('سمِّ الملف باسم شركتك.'),
  S('املأ المربع الأول. من هو عميلنا؟ اكتب فئة واضحة، مثل طلبة جامعة الموصل.',['Customer Segments']),
  S('املأ المربع الثاني. ما المشكلة التي نحلها؟ اكتب جملة واحدة.',['Value Propositions']),
  S('املأ المربع الثالث. كيف نصل إلى العميل؟ مثل إنستغرام أو تلغرام أو موقع.',['Channels']),
  S('املأ المربع الرابع. كيف نحافظ على العميل؟ مثل دعم واتساب وخصومات.',['Customer Relationships']),
  S('املأ المربع الخامس. من أين يأتي الدخل؟ مبيعات أو اشتراك أو عمولة.',['Revenue Streams']),
  S('املأ المربع السادس. ما الموارد المهمة؟ موقع وتطبيق وفريق.',['Key Resources']),
  S('املأ المربع السابع. ما الأنشطة اليومية؟',['Key Activities']),
  S('املأ المربع الثامن. من شركاؤنا؟ شركة توصيل أو بوابة دفع.',['Key Partners']),
  S('املأ المربع التاسع. ما تكاليفنا؟ استضافة وإعلانات ورواتب.',['Cost Structure']),
  S('أضف لكل مربع ملاحظة تشرح ما الجزء الرقمي فيه.'),
  S('شارك الملف مع المدرّس:',['Share','Anyone with the link can view'])],

/* ---------- feedback ---------- */
var FB_NS='alsaffar-digital-labs', FB_URL='https://abacus.jasoncameron.dev/';
function fbSend(key){
  try{var l=JSON.parse(localStorage.getItem('dbm-fb')||'{}');l[key]=(l[key]||0)+1;localStorage.setItem('dbm-fb',JSON.stringify(l))}catch(e){}
  try{fetch(FB_URL+'hit/'+FB_NS+'/'+key).catch(function(){})}catch(e){}
}
function feedbackCard(){
  var done={rate:false,wish:false};
  var box=h('section',{class:'fb'},h('h2',{text:'رأيك يهمّنا'}));
  box.appendChild(h('div',{class:'q',text:'كيف تقيّم هذا التطبيق التعليمي؟'}));
  var stars=h('div',{class:'fb-stars',role:'group','aria-label':'التقييم من 1 إلى 5 نجوم'}),t1=h('div',{class:'thanks'});
  for(var i=1;i<=5;i++)(function(n){
    var b=h('button',{type:'button','aria-label':n+' من 5'});b.appendChild(svg('star'));
    b.addEventListener('click',function(){
      if(done.rate)return;done.rate=true;fbSend('rate-'+n);
      stars.querySelectorAll('button').forEach(function(x,idx){x.classList.toggle('on',idx<n);x.disabled=true});
      t1.textContent='شكرًا لتقييمك: '+n+' من 5.';
    });
    stars.appendChild(b)})(i);
  box.appendChild(stars);box.appendChild(t1);
  box.appendChild(h('div',{class:'q',text:'هل ترغب أن تتعلم كيف تصمم مثل هذا التطبيق؟'}));
  var yn=h('div',{class:'yn'}),t2=h('div',{class:'thanks'});
  [['نعم','wish-yes'],['لا','wish-no']].forEach(function(p){
    var b=h('button',{class:'btn',type:'button',text:p[0]});
    b.addEventListener('click',function(){
      if(done.wish)return;done.wish=true;fbSend(p[1]);
      yn.querySelectorAll('button').forEach(function(x){x.disabled=true});b.classList.add('on');
      t2.textContent=p[1]==='wish-yes'?'رائع! سنخبرك عند توفر الدورة.':'شكرًا لإجابتك.';
    });
    yn.appendChild(b)});
  box.appendChild(yn);box.appendChild(t2);
  box.appendChild(h('div',{style:'color:var(--muted);font-size:14px;margin-top:8px',text:'يمكنك الإجابة في كل مرة تدخل فيها التطبيق.'}));
  return box;
}
function feedbackResults(holder){
  var keys=['rate-1','rate-2','rate-3','rate-4','rate-5','wish-yes','wish-no'];
  function draw(c,note){
    holder.innerHTML='';
    var tot=0,sum=0;for(var i=1;i<=5;i++){tot+=c['rate-'+i]||0;sum+=i*(c['rate-'+i]||0)}
    var avg=tot?(sum/tot).toFixed(1):'-';
    holder.appendChild(h('div',{text:'متوسط التقييم: '+avg+' من 5 (عدد المقيّمين '+tot+')'}));
    var res=h('div',{class:'res'});
    for(var s=5;s>=1;s--){var n=c['rate-'+s]||0;res.appendChild(h('div',{class:'row'},h('span',{text:s+' ★'}),h('div',{class:'bar'},h('i',{style:'width:'+(tot?Math.round(100*n/tot):0)+'%'})),h('span',{text:String(n)})))}
    holder.appendChild(res);
    holder.appendChild(h('div',{style:'margin-top:8px',text:'يرغبون بتعلم تصميم تطبيق مثله: نعم '+(c['wish-yes']||0)+'، لا '+(c['wish-no']||0)}));
    if(note)holder.appendChild(h('div',{style:'color:var(--muted);font-size:14px',text:note}));
  }
  var local={};try{local=JSON.parse(localStorage.getItem('dbm-fb')||'{}')}catch(e){}
  draw(local,'هذه إجابات هذا الجهاز فقط، وتتحدث إلى الإجمالي عند توفر الاتصال بخدمة العدّ.');
  var got={},ok=0,left=keys.length;
  keys.forEach(function(key){
    try{fetch(FB_URL+'get/'+FB_NS+'/'+key).then(function(r){if(r.status===404)return {value:0};if(!r.ok)throw 0;return r.json()}).then(function(d){got[key]=d.value||0;ok++}).catch(function(){}).then(fin)}catch(e){fin()}
  });
  function fin(){left--;if(left===0&&ok===keys.length)draw(got,'')}
}

  var rb=h('button',{class:'btn small',type:'button',text:'مسح تقدّمي',style:'margin-top:8px'});var armed=false;
  rb.addEventListener('click',function(){if(!armed){armed=true;rb.textContent='اضغط مرة ثانية للتأكيد';setTimeout(function(){armed=false;rb.textContent='مسح تقدّمي'},3000);return}state={done:{},qbest:0};save();qs=null;armed=false;about()});
  b3.appendChild(rb);app.appendChild(b3);

  document.title='عنّا · مختبر الأعمال الرقمية';window.scrollTo(0,0);
}

/* ---------- focus mode ---------- */
var fr=document.getElementById('focusRoot'), fState=null;
function focusMode(l){
  var idx=0;
  for(var i=0;i<l.steps.length;i++){if(!state.done[k(l,'s',i)]){idx=i;break}}
  fState={l:l,i:idx};drawFocus();
}
function closeFocus(){fState=null;fr.innerHTML='';document.removeEventListener('keydown',fkey);route()}
function fkey(e){if(!fState)return;if(e.key==='Escape')closeFocus();else if(e.key==='ArrowLeft')fgo(1);else if(e.key==='ArrowRight')fgo(-1)}
function fgo(d){var n=fState.l.steps.length,j=fState.i+d;if(j<0||j>=n)return;fState.i=j;drawFocus()}
function drawFocus(){
  var l=fState.l,i=fState.i,s=l.steps[i],key=k(l,'s',i),n=l.steps.length;
  fr.innerHTML='';
  var slide=h('div',{class:'slide'},h('div',{class:'k',text:'المختبر '+l.id+' · الخطوة '+(i+1)+' من '+n}),h('div',{class:'big',text:s.t}));
  if(s.ui.length)slide.appendChild(uiRow(s.ui));
  if(s.code)slide.appendChild(codeBox(s.code));
  var doneBtn=h('button',{class:'btn primary',type:'button',text:state.done[key]?'ألغِ التعليم':'تمّت هذه الخطوة',onclick:function(){if(state.done[key])delete state.done[key];else{state.done[key]=1}save();if(state.done[key]&&i<n-1){fState.i=i+1}drawFocus()}});
  var f=h('div',{class:'focus',role:'dialog','aria-label':'وضع العرض'},
    h('div',{class:'bar-top'},h('strong',{text:l.title}),h('div',{class:'bar',style:'flex:1'},h('i',{style:'width:'+Math.round(100*(i+1)/n)+'%'})),ibtn('close','إغلاق وضع العرض',{on:closeFocus})),
    h('div',{class:'stage'},slide),
    h('div',{class:'nav'},
      ibtn('prev','الخطوة السابقة',{cls:'big',on:function(){fgo(-1)}}),
      doneBtn,
      ibtn('next','الخطوة التالية',{cls:'big',on:function(){fgo(1)}})));
  fr.appendChild(f);
  document.removeEventListener('keydown',fkey);document.addEventListener('keydown',fkey);
}

/* ---------- theme ---------- */

function paintThemeBtn(){var dk=curTheme()==='dark';themeBtn.innerHTML='';themeBtn.appendChild(svg(dk?'sun':'moon'));themeBtn.title=themeBtn.ariaLabel=dk?'الوضع النهاري':'الوضع الليلي';themeBtn.setAttribute('aria-label',themeBtn.title);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',curTheme()==='dark'?'#101A2E':'#1B78B8')}
themeBtn.addEventListener('click',function(){var n=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('dbm-theme',n)}catch(e){}paintThemeBtn()});
paintThemeBtn();

/* ---------- visit counter ---------- */
(function(){

  var seen=false;try{seen=sessionStorage.getItem('dbm-seen')==='1'}catch(e){}
  var local=0;try{local=parseInt(localStorage.getItem('dbm-local-visits')||'0',10)||0;if(!seen){local++;localStorage.setItem('dbm-local-visits',String(local))}}catch(e){}

/* ---------- routing ---------- */
function route(){
  if(fState){fState=null;fr.innerHTML=''}
  var hs=location.hash.replace('#',''),m=hs.match(/^lab-(\d+)$/);
  drawTabs(m?'':hs);
  if(m)lab(parseInt(m[1],10));
  else if(hs==='tools')tools();
  else if(hs==='cards')cards();
  else if(hs==='quiz')quiz();
  else if(hs==='about')about();
  else{home();window.scrollTo(0,0)}
  setVisits();
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',function(e){
  if(fState||document.getElementById('modal'))return;
  var tg=(e.target&&e.target.tagName)||'';if(/INPUT|TEXTAREA|SELECT/.test(tg))return;
  var m=location.hash.match(/^#lab-(\d+)$/);if(!m)return;var n=parseInt(m[1],10);
  if(e.key==='ArrowLeft'&&n<LABS.length)location.hash='lab-'+(n+1);
  else if(e.key==='ArrowRight'&&n>1)location.hash='lab-'+(n-1);
});
route();
